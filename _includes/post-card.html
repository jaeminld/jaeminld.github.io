<!-- _includes/post-card.html -->
<article class="post" data-cats="{{ include.post.categories | join:'|' | escape }}">
  {% if include.post.img %}
    <a class="post-thumbnail"
       style="background-image:url('{{ site.baseurl }}/assets/img/{{ include.post.img }}')"
       href="{{ site.baseurl }}{{ include.post.url }}"></a>
  {% endif %}
  <div class="post-content">
    <h2 class="post-title">
      <a href="{{ site.baseurl }}{{ include.post.url }}">{{ include.post.title }}</a>
    </h2>
    <p>{{ include.post.content | strip_html | truncatewords: 15 }}</p>
    <span class="post-date">{{ include.post.date | date: '%Y, %b %d' }}  </span>
    <!-- <span class="post-words">
      {% capture words %}{{ include.post.content | number_of_words }}{% endcapture %}
      {% unless words contains "-" %}
        {{ words | plus: 250 | divided_by: 250 | append: " minute read" }}
      {% endunless %}
    </span> -->
  </div>
</article>
